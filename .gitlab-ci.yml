# .gitlab-ci.yml
# NOTE: this must run on a shell runner that has
# /ssu/bsssu/conda_envs_bsssu/flanders_r_2.0 already present.

image: rocker/tidyverse   # still need R & devtools etc.

variables:
  # point R to the conda‐installed libraries
  R_LIBS_USER: "/ssu/bsssu/conda_envs_bsssu/flanders_r_2.0/lib/R/library"

stages:
  - test
  - build
  - check

.before_script_conda: &before_script_conda |
  # activate your prebuilt conda env
  source /ssu/bsssu/conda_envs_bsssu/flanders_r_2.0/bin/activate
  # confirm R sees the right library
  Rscript -e "cat('Library is', .libPaths(), '\n')"

test-job:
  stage: test
  before_script:
    - *before_script_conda
  script:
    # now flanders should be installed in that env already, or we'll install it in build
    - Rscript -e "devtools::test()"

build-job:
  stage: build
  before_script:
    - *before_script_conda
  script:
    # regenerate docs & build
    - Rscript -e "roxygen2::roxygenise()"
    - R CMD build ./
    # install only flanders (and its deps are already in the conda env)
    - |
      PKG_VERSION=$(grep -i ^Version DESCRIPTION | cut -d ':' -f2 | tr -d ' ')
      PKG_NAME=$(grep -i ^Package DESCRIPTION | cut -d ':' -f2 | tr -d ' ')
      TARBALL="${PKG_NAME}_${PKG_VERSION}.tar.gz"
      Rscript -e "install.packages('${TARBALL}', lib=Sys.getenv('R_LIBS_USER'), repos=NULL, type='source')"
    # check the newly installed tarball
    - R CMD check "${TARBALL}" --no-manual

check-job:
  stage: check
  before_script:
    - *before_script_conda
  script:
    # final sanity‐check
    - R CMD check ./ --no-manual